<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Empy Studio</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <header>
    <div class="brand">
      <img class="brand-logo" src="/assets/empy-logo.png" alt="EMPY logo">
      <div class="brand-copy"><strong>Empy Studio</strong><small id="subtitle">توسعه‌ی پروژه با ایجنت‌های هماهنگ</small></div>
    </div>
    <button id="language" type="button" aria-label="Switch language" aria-pressed="false">English</button>
  </header>
  <main>
    <div id="notice" class="notice hidden" role="alert" aria-live="assertive"></div>
    <div id="message" class="message hidden" role="status" aria-live="polite"></div>
    <section id="screen"></section>
  </main>
  <script src="/assets/app.js"></script>
</body>
</html>
