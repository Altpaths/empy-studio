name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install ".[dev]"
      - run: ruff check .
      - run: mypy src
      - run: pytest -q
      - name: Measure bounded context and local runtime thresholds
        run: python scripts/run_product_benchmarks.py --max-seconds 5 --min-savings-percentage 1
      - name: Build wheel and source distribution
        run: python -m build --no-isolation --wheel --sdist --outdir build/packages
      - name: Install the built wheel in a fresh environment
        run: |
          python -m venv build/clean-venv
          build/clean-venv/bin/python -m pip install --disable-pip-version-check build/packages/*.whl
          build/clean-venv/bin/empy --help
          build/clean-venv/bin/empy-web --help
          build/clean-venv/bin/python -c "import importlib.metadata; assert importlib.metadata.version('empy-studio')"

  platform-smoke:
    name: Platform smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install ".[dev]"
      - run: python -m empy_studio.cli --help
      - run: python -m empy_studio.web_desktop --help
      - run: python -m pytest -q tests/test_platform_support.py tests/test_user_errors.py tests/test_project_delivery.py tests/test_web_assets.py

  windows-installer-smoke:
    name: Windows installer smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install ".[dev]"
      - name: Build Windows installer assets
        shell: pwsh
        run: |
          python scripts/build_release_assets.py --output build/release-assets
      - name: Install and exercise the relocated Windows installer
        shell: pwsh
        run: |
          $package = (Get-ChildItem build/release-assets -Filter *.whl | Select-Object -First 1).FullName
          python scripts/smoke_windows_installer.py `
            --installer build/release-assets/install-windows-x86_64.ps1 `
            --package $package `
            --target windows-x86_64

  release-assets:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install ".[dev]"
      - name: Build release assets without publishing
        run: python scripts/build_release_assets.py --output build/release-assets
      - name: Verify package and installer digests
        run: python scripts/verify_release_assets.py build/release-assets/release-assets.json
      - name: Exercise the relocated Linux installer
        run: |
          python scripts/smoke_unix_installer.py \
            --installer build/release-assets/install-linux-x86_64.sh \
            --package build/release-assets/*.whl \
            --target linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: empy-release-assets
          path: build/release-assets
