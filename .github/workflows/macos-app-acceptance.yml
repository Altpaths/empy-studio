name: macOS app acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/build_macos_app.py'
      - 'scripts/macos*_entrypoint.py'
      - 'scripts/run_macos_app_acceptance.py'
      - 'src/empy_studio/**'
      - '.github/workflows/macos-app-acceptance.yml'

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install build and browser tools
        run: |
          python -m pip install '.[release]' playwright
          python -m playwright install chromium
      - name: Build persistent app
        run: |
          python scripts/build_macos_app.py --source-root . --output 'build/Empy Studio.app'
      - name: Run normal and recovery scenarios
        shell: bash
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          failed=0
          for scenario in normal recovery; do
            python scripts/run_macos_app_acceptance.py \
              --app 'build/Empy Studio.app' --release-tag "v$version" \
              --scenario "$scenario" --repetitions 2 \
              --evidence-dir "build/acceptance-$scenario" || failed=1
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-app-acceptance-evidence
          path: build/acceptance-*
          if-no-files-found: warn
