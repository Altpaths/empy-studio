name: Finalize macOS Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release-candidate tag to finalize"
        required: true
        default: v0.1.26
        type: string
      promote_latest:
        description: "Sign, notarize, and promote the candidate to Latest"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: finalize-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  sign_and_notarize:
    name: Sign and notarize macOS app (${{ matrix.architecture }})
    if: ${{ inputs.promote_latest == true }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-14
            architecture: arm64
          - os: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.os }}
    environment:
      name: release
    env:
      GH_TOKEN: ${{ github.token }}
      ARCHITECTURE: ${{ matrix.architecture }}
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - name: Validate release candidate
        shell: bash
        run: |
          set -euo pipefail
          python - "$RELEASE_TAG" <<'PY'
          import re
          import sys

          if re.fullmatch(r"v\d+\.\d+\.\d+(?:[-A-Za-z0-9.]+)?", sys.argv[1]) is None:
              raise SystemExit(f"Invalid release tag: {sys.argv[1]!r}")
          PY
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Download unsigned release-candidate app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/input
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "empy-studio-macos-${ARCHITECTURE}.zip" \
            --dir build/input

      - name: Install Developer ID certificate in an ephemeral keychain
        shell: bash
        run: |
          set -euo pipefail
          : "${APPLE_CERTIFICATE_P12_BASE64:?Missing APPLE_CERTIFICATE_P12_BASE64}"
          : "${APPLE_CERTIFICATE_PASSWORD:?Missing APPLE_CERTIFICATE_PASSWORD}"
          : "${KEYCHAIN_PASSWORD:?Missing KEYCHAIN_PASSWORD}"
          KEYCHAIN_PATH="$RUNNER_TEMP/empy-release.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          export KEYCHAIN_PATH CERTIFICATE_PATH
          python -c 'import base64, pathlib, sys; pathlib.Path(sys.argv[1]).write_bytes(base64.b64decode(sys.stdin.read()))' \
            "$CERTIFICATE_PATH" <<< "$APPLE_CERTIFICATE_P12_BASE64"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Sign, notarize, staple, and Gatekeeper-check the app
        shell: bash
        run: |
          set -euo pipefail
          : "${DEVELOPER_ID_APPLICATION:?Missing DEVELOPER_ID_APPLICATION}"
          : "${APPLE_ID:?Missing APPLE_ID}"
          : "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID}"
          : "${APPLE_APP_PASSWORD:?Missing APPLE_APP_PASSWORD}"
          KEYCHAIN_PATH="$RUNNER_TEMP/empy-release.keychain-db"
          trap 'security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1 || true' EXIT
          INPUT_ZIP="build/input/empy-studio-macos-${ARCHITECTURE}.zip"
          EXTRACTED="$RUNNER_TEMP/empy-app-${ARCHITECTURE}"
          APP_PATH="$EXTRACTED/Empy Studio.app"
          SIGNED_DIR="build/signed"
          SIGNED_ZIP="$SIGNED_DIR/empy-studio-macos-${ARCHITECTURE}.zip"
          EVIDENCE="$SIGNED_DIR/macos-signing-evidence-${ARCHITECTURE}.json"
          mkdir -p "$EXTRACTED" "$SIGNED_DIR"
          ditto -x -k "$INPUT_ZIP" "$EXTRACTED"
          xattr -cr "$APP_PATH"
          codesign --force --deep --options runtime --timestamp \
            --sign "$DEVELOPER_ID_APPLICATION" "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          ditto -c -k --norsrc --noextattr --noqtn --keepParent \
            "$APP_PATH" "$SIGNED_ZIP"
          xcrun notarytool submit "$SIGNED_ZIP" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"
          "$APP_PATH/Contents/MacOS/Empy Studio" --help
          rm -f "$SIGNED_ZIP"
          ditto -c -k --norsrc --noextattr --noqtn --keepParent \
            "$APP_PATH" "$SIGNED_ZIP"
          shasum -a 256 "$SIGNED_ZIP" > "$SIGNED_ZIP.sha256"
          python - "$EVIDENCE" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          Path(sys.argv[1]).write_text(
              json.dumps(
                  {
                      "schema_version": 1,
                      "status": "notarized",
                      "architecture": os.environ["ARCHITECTURE"],
                      "signing_identity": os.environ["DEVELOPER_ID_APPLICATION"],
                      "notarization": "accepted",
                      "stapled": True,
                      "gatekeeper": "accepted",
                  },
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: macos-signed-${{ matrix.architecture }}
          path: build/signed/*

  promote_release:
    name: Verify and promote release to Latest
    if: ${{ inputs.promote_latest == true }}
    needs: sign_and_notarize
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip
      - run: pip install ".[dev]"

      - name: Download current release assets
        shell: bash
        run: |
          set -euo pipefail
          python - "$RELEASE_TAG" <<'PY'
          import re
          import sys

          if re.fullmatch(r"v\d+\.\d+\.\d+(?:[-A-Za-z0-9.]+)?", sys.argv[1]) is None:
              raise SystemExit(f"Invalid release tag: {sys.argv[1]!r}")
          PY
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets

      - uses: actions/download-artifact@v4
        with:
          name: macos-signed-arm64
          path: signed/arm64

      - uses: actions/download-artifact@v4
        with:
          name: macos-signed-x86_64
          path: signed/x86_64

      - name: Replace candidate apps with signed notarized apps
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -maxdepth 1 -type f \
            \( -name 'empy-studio-macos-*.zip' -o -name 'empy-studio-macos-*.zip.sha256' \) \
            -delete
          cp signed/arm64/empy-studio-macos-arm64.zip* release-assets/
          cp signed/arm64/macos-signing-evidence-arm64.json release-assets/
          cp signed/x86_64/empy-studio-macos-x86_64.zip* release-assets/
          cp signed/x86_64/macos-signing-evidence-x86_64.json release-assets/

      - name: Merge and verify final manifest
        shell: bash
        run: |
          set -euo pipefail
          python scripts/merge_release_assets.py \
            release-assets \
            release-assets/*.zip \
            release-assets/*.sha256 \
            release-assets/macos-signing-evidence-*.json
          python scripts/verify_release_assets.py \
            --require-notarized \
            release-assets/release-assets.json

      - name: Upload final assets and mark release Latest
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            release-assets/*
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Empy Studio $RELEASE_TAG" \
            --notes-file release-assets/RELEASE_NOTES.md \
            --draft=false \
            --prerelease=false \
            --latest
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isPrerelease,url
