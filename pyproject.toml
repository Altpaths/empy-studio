[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
  "/.empy/",
  "/.venv/",
  "/build/",
  "/dist/",
  "/outputs/",
  "/work/",
  "/private/",
  "/releases/",
  "/artifacts/",
  "/**/*.zip",
]

[tool.hatch.build.targets.wheel]
force-include = {"examples/fixtures/php-site" = "empy_studio/sample_project"}

[project]
name = "empy-studio"
version = "0.1.48"
description = "A lightweight operating layer for bounded, verifiable AI-assisted product development."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Azadeh Sharifi"}]
keywords = ["ai-agents", "software-development", "orchestration", "product-development", "codex", "claude-code"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "tomli>=2.0.1",
]

[project.optional-dependencies]
dev = ["build>=1.2", "hatchling>=1.25", "pytest>=8", "ruff>=0.6", "mypy>=1.10"]
release = ["build>=1.2", "hatchling>=1.25", "pyinstaller>=6.11"]

[project.scripts]
empy = "empy_studio.cli:main"
empy-web = "empy_studio.web_desktop:main"

empy-desktop = "empy_studio.desktop.shell:launch_desktop"
[project.urls]
Homepage = "https://github.com/Altpaths/empy-studio"
Documentation = "https://github.com/Altpaths/empy-studio/tree/main/docs"
Issues = "https://github.com/Altpaths/empy-studio/issues"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.mypy]
python_version = "3.10"
strict = true
