[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "empy-studio"
version = "0.1.0"
description = "A lightweight operating layer for bounded, verifiable AI-assisted product development."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Azadeh Sharifi"}]
keywords = ["ai-agents", "software-development", "orchestration", "product-development", "codex", "claude-code"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
empy = "empy_studio.cli:main"

[project.urls]
Homepage = "https://github.com/Azadeh Sharifi/empy-studio"
Documentation = "https://github.com/Azadeh Sharifi/empy-studio/tree/main/docs"
Issues = "https://github.com/Azadeh Sharifi/empy-studio/issues"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.mypy]
python_version = "3.10"
strict = true
